# 头部菜单，title: link
menu:
  首页: /
  分类: /categories
  标签: /tags
  归档: /archives
  关于: /about

# 是否显示目录
TOC: true

# 是否自动播放音乐
autoplay: false

# 默认音乐（随机播放）
mp3:

# 首页封面图, 为空时取文章的cover作为封面(注意跨域问题,建议使用同源图片)
welcome_cover: /img/index-cover-web.jpg

# 默认文章封面图（随机调用,支持外链）
cover:
  - /img/index-cover-web.jpg

# 是否显示Twitter分享卡片图像
twitterpic:
  enable: false
  src:
  creatorid:

# 是否使用mathjax
mathjax: false

# 是否关闭默认滚动条
scrollbar: true

# 本地搜索
local_search:
  enable: true

# 是否显示 一言(hitokoto)
hitokoto: true

# 链接(可选:facebook,twitter,github,wechat,email)
links:
  github: https://github.com/Eanzkpli
  email: mailto:eanzkpli@outlook.com

# 备案
beian:
  enable: false
  enableFooter: false
  beianInfo:
  link:

# Gitalk 评论插件
gitalk:
  enable: false
  autoExpand: false
  clientID: ''
  clientSecret: ''
  repo: ''
  owner: ''
  admin: ['']
  id: location.pathname
  distractionFreeMode: false

# 网站关键字
keywords: 博客,技术,生活

# google analytics
google_analytics:

# 网站ico
favicon: /img/favicon.png

# rss文件
rss: atom.xml

# 版权信息
copyright:
  enable: true
  license: "CC BY-NC-SA 4.0"
